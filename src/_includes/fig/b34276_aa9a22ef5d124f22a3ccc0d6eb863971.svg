<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-label="Spielraum nachhaltiger Entwicklung: Business redesigned erschließt regenerative Möglichkeiten zwischen Business as usual und Gemeinschaften, öffentlichem Dienst und NGOs">
  <!-- degenerativ -->
  <line class="s-ink" x1="175" y1="38" x2="175" y2="52"/>
  <path class="f-ink" d="M 175 60 l -6 -10 h 12 z"/>
  <line class="s-ink" x1="175" y1="66" x2="175" y2="80"/>
  <path class="f-ink" d="M 175 88 l -6 -10 h 12 z"/>
  <line class="s-ink" x1="175" y1="94" x2="175" y2="108"/>
  <path class="f-ink" d="M 175 116 l -6 -10 h 12 z"/>

  <!-- regenerativ -->
  <line class="s-ink" x1="490" y1="38" x2="490" y2="52"/>
  <path class="f-ink" d="M 490 60 l -6 -10 h 12 z"/>
  <line class="s-ink" x1="490" y1="66" x2="490" y2="80"/>
  <path class="f-ink" d="M 490 88 l -6 -10 h 12 z"/>
  <line class="s-ink" x1="490" y1="94" x2="490" y2="108"/>
  <path class="f-ink" d="M 490 116 l -6 -10 h 12 z"/>

  <path class="s-ink" d="M 472 46 A 34 34 0 0 0 472 114"/>
  <path class="f-ink" d="M 482 114 l -12 -6 v 12 z"/>
  <path class="s-ink" d="M 508 114 A 34 34 0 0 0 508 46"/>
  <path class="f-ink" d="M 498 46 l 12 -6 v 12 z"/>
  <text class="t-wide" x="175" y="160" text-anchor="middle">Degenerativ</text>
  <text class="t-wide t-forest" x="490" y="160" text-anchor="middle">Regenerativ</text>
  <circle class="f-ink" cx="185" cy="390" r="165"/>
  <circle class="f-tint" cx="820" cy="390" r="160"/>
  <circle class="f-forest" cx="490" cy="390" r="165"/>
  <circle class="s-paper" cx="490" cy="390" r="165"/>
  <line class="s-dash" x1="320" y1="24" x2="320" y2="566"/>
  <text class="t-head t-inv" x="175" y="322" text-anchor="middle">Business</text>
  <text class="t-head t-inv" x="175" y="350" text-anchor="middle">as usual</text>
  <text class="t-body t-inv" x="175" y="388" text-anchor="middle">Designed für die</text>
  <text class="t-body t-inv" x="175" y="411" text-anchor="middle">Maximierung von</text>
  <text class="t-body t-inv" x="175" y="434" text-anchor="middle">Gewinnen und</text>
  <text class="t-body t-inv" x="175" y="457" text-anchor="middle">Dividenden</text>
  <text class="t-head" x="820" y="316" text-anchor="middle">Gemeinschaften,</text>
  <text class="t-head" x="820" y="344" text-anchor="middle">Vereine</text>
  <text class="t-head" x="820" y="390" text-anchor="middle">Öffentlicher</text>
  <text class="t-head" x="820" y="418" text-anchor="middle">Dienst</text>
  <text class="t-head" x="820" y="464" text-anchor="middle">NGOs &amp; Charities</text>
  <text class="t-head t-inv" x="490" y="332" text-anchor="middle">Business</text>
  <text class="t-head t-inv" x="490" y="360" text-anchor="middle">redesigned</text>
  <text class="t-body t-inv" x="490" y="398" text-anchor="middle">um regenerative</text>
  <text class="t-body t-inv" x="490" y="421" text-anchor="middle">Möglichkeiten zu</text>
  <text class="t-body t-inv" x="490" y="444" text-anchor="middle">erschließen</text>
</svg>
