  <text class="t-body" x="195" y="276" text-anchor="middle">Ökosystem</text>
  <text class="t-body" x="400" y="92" text-anchor="middle">Beziehung zum</text>
  <text class="t-body" x="400" y="114" text-anchor="middle">Ökosystem</text>
  <text class="t-body" x="605" y="232" text-anchor="middle">Zugrunde</text>
  <text class="t-body" x="605" y="254" text-anchor="middle">liegende</text>
  <text class="t-body" x="605" y="276" text-anchor="middle">Geschäftslogik</text>
  <text class="t-body t-inv" x="195" y="338" text-anchor="middle">Gespür für</text>
