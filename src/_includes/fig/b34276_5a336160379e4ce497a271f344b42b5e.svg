  <path class="f-ink" d="M 175 60 l -6 -10 h 12 z"/>
  <line class="s-ink" x1="175" y1="66" x2="175" y2="80"/>
  <path class="f-ink" d="M 175 88 l -6 -10 h 12 z"/>
  <line class="s-ink" x1="175" y1="94" x2="175" y2="108"/>
  <path class="f-ink" d="M 175 116 l -6 -10 h 12 z"/>

  <!-- regenerativ -->
  <line class="s-ink" x1="490" y1="38" x2="490" y2="52"/>
  <path class="f-ink" d="M 490 60 l -6 -10 h 12 z"/>
  <line class="s-ink" x1="490" y1="66" x2="490" y2="80"/>
  <path class="f-ink" d="M 490 88 l -6 -10 h 12 z"/>
  <line class="s-ink" x1="490" y1="94" x2="490" y2="108"/>
