# Redaktion (Sveltia CMS) – https://sveltiacms.app
# Anmeldung: GitHub-Zugangstoken (Fine-grained, nur dieses Repo). 2FA erzwingt GitHub.
backend:
  name: github
  repo: DEIN-GITHUB-ACCOUNT/regenerative-unternehmen   # <- anpassen
  branch: main
  auth_methods: [token]
  commit_messages:
    create: "Neu: {{collection}} „{{slug}}“"
    update: "Geändert: {{collection}} „{{slug}}“"
    delete: "Gelöscht: {{collection}} „{{slug}}“"
    uploadMedia: "Bild hochgeladen: {{path}}"
    deleteMedia: "Bild gelöscht: {{path}}"

site_url: https://www.regenerative-unternehmen.de
display_url: https://www.regenerative-unternehmen.de
logo:
  src: /assets/favicon.svg

media_folder: src/assets/img/uploads
public_folder: /assets/img/uploads

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  # ---------------------------------------------------------------- Blog
  - name: posts
    label: Blog
    label_singular: Beitrag
    folder: src/posts
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    summary: "{{title}} · {{date}}"
    sortable_fields: [date, title]
    preview_path: "post/{{slug}}/"
    fields:
      - { name: title, label: Titel, widget: string }
      - { name: description, label: Kurzbeschreibung, widget: text, required: false, hint: "1–2 Sätze für Blogübersicht und Suchmaschinen" }
      - { name: date, label: Datum, widget: datetime, format: "YYYY-MM-DD", time_format: false }
      - { name: updated, label: Zuletzt aktualisiert, widget: datetime, format: "YYYY-MM-DD", time_format: false, required: false }
      - name: author
        label: Autor:in
        widget: select
        options: ["Marcel Rößner", "Karry Schwettmann"]
        default: "Marcel Rößner"
      - { name: image, label: Titelbild, widget: image, required: false, hint: "Querformat, mindestens 1600 px breit" }
      - { name: tags, label: Themen, widget: list, required: false, hint: "Ein Thema pro Zeile, z. B. Regeneration" }
      - { name: permalink, label: "Adresse (leer lassen)", widget: string, required: false, hint: "Wird automatisch /post/<name>/ – nur bei alten Beiträgen gesetzt" }
      - { name: legacy, label: "Alte Wix-Adresse", widget: hidden }
      - { name: body, label: Text, widget: markdown, modes: [rich_text, raw] }

  # ---------------------------------------------------------------- Kerntexte
  - name: kerntexte
    label: Kerntexte
    editor: { preview: false }
    files:
      - name: model
        label: Modell (Startseite, 5 Stufen)
        file: src/_data/model.json
        fields:
          - name: stages
            label: Stufen
            widget: list
            allow_add: false
            allow_remove: false
            allow_reorder: false
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: Name, widget: string }
              - { name: claim, label: Kernsatz, widget: string }
              - { name: text, label: Erklärung, widget: text }

      - name: team
        label: Team
        file: src/_data/team.json
        fields:
          - name: members
            label: Personen
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: Name, widget: string }
              - { name: role, label: Rolle, widget: string }
              - { name: focus, label: Schwerpunkte, widget: list, hint: "Ein Schwerpunkt pro Zeile" }
              - { name: image, label: Porträt, widget: image, hint: "Hochformat 4:5" }
              - { name: linkedin, label: LinkedIn-Link, widget: string, required: false }

      - name: products
        label: Produkte
        file: src/_data/products.json
        fields:
          - name: items
            label: Produkte
            widget: list
            allow_add: false
            allow_remove: false
            summary: "{{fields.title}}"
            fields:
              - { name: key, label: Interner Schlüssel, widget: hidden }
              - { name: slug, label: Adresse, widget: hidden }
              - { name: title, label: Titel, widget: string }
              - { name: kicker, label: Kategorie, widget: string }
              - { name: price, label: Preis, widget: string }
              - { name: teaser, label: Kurzbeschreibung, widget: text }
              - { name: image, label: Bild 1, widget: image }
              - { name: image2, label: Bild 2, widget: image }

      - name: glossar
        label: Glossar
        file: src/_data/glossar.json
        fields:
          - name: terms
            label: Begriffe
            widget: list
            summary: "{{fields.term}}"
            fields:
              - { name: term, label: Begriff, widget: string }
              - { name: short, label: Kurzdefinition (ein Satz), widget: text }
              - { name: text, label: Erklärung (2–3 Sätze), widget: text }
              - { name: post, label: Blogbeitrag dazu, widget: relation, collection: posts, value_field: "{{slug}}", search_fields: [title], display_fields: [title], required: false }
              - { name: related, label: "Siehe auch (Begriffe)", widget: list, required: false, hint: "Ein Begriff pro Zeile, genau wie oben geschrieben" }

      - name: site
        label: Einstellungen (Kontakt, Shop, Newsletter)
        file: src/_data/site.json
        fields:
          - { name: title, label: Name der Website, widget: string }
          - { name: claim, label: Claim, widget: string }
          - { name: description, label: Beschreibung für Suchmaschinen, widget: text }
          - { name: url, label: Adresse, widget: hidden }
          - { name: lang, label: Sprache, widget: hidden }
          - { name: email, label: E-Mail, widget: string }
          - { name: linkedin, label: LinkedIn, widget: string }
          - { name: year, label: Jahr im Copyright, widget: number, value_type: int }
          - name: shop
            label: Shop-Links
            widget: object
            hint: "Leer lassen = Button öffnet eine E-Mail"
            fields:
              - { name: kartenset, label: "Kartenset (z. B. Stripe-Link)", widget: string, required: false }
              - { name: whitepaper, label: Whitepaper, widget: string, required: false }
          - name: newsletter
            label: Newsletter
            widget: object
            fields:
              - { name: action, label: "Formular-Adresse des Anbieters", widget: string, required: false, hint: "Leer = Anmeldung per E-Mail" }
              - { name: emailField, label: Name des E-Mail-Felds, widget: string, default: email }
          - { name: orderFormAction, label: "Bestell- und Anfrageformular: Adresse, die die E-Mail auslöst", widget: string, required: false, hint: "Leer = vorausgefüllte E-Mail im Mailprogramm des Kunden. Mit Adresse: Bestellung kommt direkt per E-Mail bei Ihnen an." }
          - { name: contactFormAction, label: "Kontaktformular-Adresse (z. B. Formspree)", widget: string, required: false }

      - name: impressum
        label: Impressum
        file: src/impressum.md
        fields:
          - { name: layout, widget: hidden }
          - { name: title, label: Titel, widget: string }
          - { name: permalink, widget: hidden }
          - { name: description, label: Beschreibung, widget: string }
          - { name: body, label: Text, widget: markdown, modes: [raw, rich_text] }

      - name: datenschutz
        label: Datenschutz
        file: src/datenschutz.md
        fields:
          - { name: layout, widget: hidden }
          - { name: title, label: Titel, widget: string }
          - { name: permalink, widget: hidden }
          - { name: description, label: Beschreibung, widget: string }
          - { name: body, label: Text, widget: markdown, modes: [raw, rich_text] }
